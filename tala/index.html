<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website"><meta property="og:site_name" content="GumballZ">
<meta property="og:url" content="https://gumballzgames.vercel.app/tala/">
<meta property="og:title" content="Tá lả (Phỏm) – chơi online cùng bạn bè | GumballZ">

<meta property="og:image" content="https://gumballzgames.vercel.app/shared/img/og/tala.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=3"><link rel="manifest" href="../manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-title" content="GumballZ"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui/gamekit.css?v=7">
<link rel="stylesheet" href="../shared/ui/deck/deck.css?v=1">
<link rel="stylesheet" href="css/tala.css?v=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../shared/ui/shell.css?v=23">
<link rel="stylesheet" href="../shared/css/topbar.css?v=8">
</head>
<body>
<script src="../shared/ui/topbar.js?v=8"></script>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub gumballz-chip" href="../" aria-label="Về trang chủ GumballZ" title="Về trang chủ GumballZ"><img src="../favicon.svg?v=3" alt="" width="26" height="26"><span>GumballZ</span></a>
  <div class="home-card">
    <div class="hero" id="hero"></div>
    <h1 class="logo" translate="no">Tá <span>lả</span></h1>
    <p class="tag">Ăn cây, hạ phỏm, canh ù – ai ít điểm nhất thì thắng 🀄</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn big" id="btn-offline">🤖 Chơi với bot</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Cách chơi</button>
    </div>
    <p class="note">2–4 người · bài 52 lá · chỉ xu ảo cho vui, không tiền thật.</p>
  </div>
</section>

<!-- PHÒNG CHỜ -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip" id="btn-copy">Sao chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Người chơi <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <div id="add-box"></div>
      </div>
      <div class="panel">
        <h3>Luật bàn</h3>
        <div id="opts"></div>
      </div>
    </div>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
    <div class="start-bar"><button class="btn big pri" id="btn-start">🃏 Chia bài</button></div>
  </div>
</section>

<!-- VÁN CHƠI -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ic" id="btn-leave" title="Rời ván" aria-label="Rời ván">←</button>
    <div class="round" id="round" aria-live="polite"></div>
    <span class="sp"></span>
    <div class="tools">
      <button class="chip ic" id="btn-sound" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ic" id="btn-guide" title="Cách chơi" aria-label="Cách chơi">📖</button>
    </div>
  </header>
  <div class="arena">
    <div class="seats" id="seats"></div>
    <div class="felt"><div class="pile" id="pile"></div><div class="tbl" id="tbl"></div></div>
    <div class="mine" id="mine"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="acts" id="acts"></div>
    <div class="hand" id="hand"></div>
  </div>
</section>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/main.js?v=23"></script>
<script type="module" async src="../shared/ui/homebtn.js?v=71"></script> <!-- async: chạy ngay khi tải xong, không chờ main.js (nặng) → nút hiện sớm, đỡ giật -->
<script type="module" async src="../shared/ui/homesplit.js?v=1"></script>
<script type="module" async src="../shared/ui/feel.js?v=54"></script>
</body>
</html>
