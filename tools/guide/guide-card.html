<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ảnh hướng dẫn game — GumballZ Boardgame</title>
<!--
  Template ảnh hướng dẫn từng game (patch -111) — khổ vuông 1080×1080.
  Cách dùng:
    1) Mở bằng trình duyệt: tools/guide/guide-card.html?g=<slug> (cần máy chủ tĩnh ở gốc repo, vd. 127.0.0.1:8128)
    2) Render hàng loạt: /tmp/render-guide-cards.mjs (parent chạy — Chromium không chạy được từ exec của subagent)
  Dữ liệu: tools/guide/guide-cards.json (tên + icon lấy từ shared/ui/stats.js, bước + luật thắng tóm tắt từ <game>/huong-dan/).
  Chữ tiếng Việt render từ HTML nên luôn chính xác (không dùng AI sinh ảnh).
  LƯU Ý: icon emoji có thể hiện thành ô vuông nếu máy render thiếu font emoji màu — kiểm tra 1 ảnh mẫu trước khi render cả lô.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e2d4}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',system-ui,sans-serif}
  #card{width:1080px;height:1080px;flex:none;background:#FFF8EE;border:6px solid #241A38;border-radius:48px;padding:34px 44px 28px;display:flex;flex-direction:column;color:#241A38;overflow:hidden;position:relative}
  #card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,rgba(250,205,51,.28),transparent 42%),radial-gradient(circle at 6% 92%,rgba(46,197,182,.20),transparent 40%);pointer-events:none}
  #card>*{position:relative}
  .eyebrow{font-weight:900;font-size:30px;letter-spacing:6px;color:#FF5A60;text-transform:uppercase}
  .head{display:flex;align-items:center;gap:28px;background:#FACD33;border:4px solid #241A38;border-radius:28px;padding:22px 28px;box-shadow:6px 6px 0 #241A38;margin-top:10px}
  .head .ic{flex:none;width:150px;height:150px;border-radius:50%;background:#FFF8EE;border:4px solid #241A38;display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1}
  .head h1{font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;font-size:76px;line-height:1.02;letter-spacing:.5px}
  .head .sub{font-weight:800;font-size:30px;color:#5b4a68;margin-top:6px}
  .steps{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:26px 6px 10px}
  .step{display:flex;align-items:center;gap:22px}
  .step .n{flex:none;width:74px;height:74px;border-radius:50%;border:4px solid #241A38;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-weight:800;font-size:40px;color:#241A38;background:#FACD33;box-shadow:4px 4px 0 #241A38}
  .step:nth-child(2) .n{background:#FF5A60;color:#fff}
  .step:nth-child(3) .n{background:#2EC5B6;color:#fff}
  .step:nth-child(4) .n{background:#B9A6FF}
  .step:nth-child(5) .n{background:#FFB98A}
  .step p{font-weight:800;font-size:35px;line-height:1.28}
  .win{border:4px solid #241A38;border-radius:24px;background:#241A38;color:#fff;padding:20px 26px;box-shadow:6px 6px 0 rgba(36,26,56,.25)}
  .win b{display:block;font-family:'Baloo 2','Nunito',system-ui,sans-serif;font-size:30px;letter-spacing:2px;color:#FACD33;margin-bottom:4px}
  .win span{font-weight:800;font-size:34px;line-height:1.3}
  .foot{margin-top:20px;text-align:center;font-weight:900;font-size:28px;color:#8a7f96;letter-spacing:1px}
  .foot b{color:#241A38}
  /* co chữ lại nếu 5 bước dài làm tràn khung */
  #card.tight .step p{font-size:32px}
  #card.tight .steps{gap:12px}
  #card.tight .head h1{font-size:68px}
  #card.tight .win span{font-size:31px}
  #card.tighter .step p{font-size:29px}
  #card.tighter .steps{gap:8px}
  #card.tighter .head h1{font-size:62px}
  #card.tighter .win span{font-size:28px}
  #card.tighter .step .n{width:64px;height:64px;font-size:34px}
  #card.tighter .head .ic{width:130px;height:130px;font-size:84px}
  .err{max-width:640px;margin:40px auto;padding:24px;background:#fff;border:3px solid #FF5A60;border-radius:16px;font:700 18px/1.6 Nunito,system-ui,sans-serif;color:#241A38}
</style>
</head>
<body>
<div id="card" aria-hidden="true"></div>
<script>
(function () {
  var card = document.getElementById('card');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function render(g) {
    var steps = (g.steps || []).map(function (s, i) {
      return '<div class="step"><span class="n">' + (i + 1) + '</span><p>' + esc(s) + '</p></div>';
    }).join('');
    card.innerHTML =
      '<div class="eyebrow">Hướng dẫn chơi</div>' +
      '<div class="head"><span class="ic">' + esc(g.icon || '🎲') + '</span><div><h1>' + esc(g.name || g.slug) + '</h1><div class="sub">Cách chơi nhanh trong 1 phút</div></div></div>' +
      '<div class="steps">' + steps + '</div>' +
      '<div class="win"><b>🏆 THẮNG KHI</b><span>' + esc(g.win || '') + '</span></div>' +
      '<div class="foot"><b>GumballZ Boardgame</b> · Mở link là chơi</div>';
    // co chữ nếu tràn khung 1080×1080
    requestAnimationFrame(function () {
      if (card.scrollHeight > 1080 || card.scrollWidth > 1080) card.classList.add('tight');
      requestAnimationFrame(function () {
        if (card.scrollHeight > 1080 || card.scrollWidth > 1080) card.classList.add('tighter');
        card.classList.add('ready');
        document.title = 'Hướng dẫn chơi ' + (g.name || g.slug);
      });
    });
  }
  function fail(msg) {
    document.body.innerHTML = '<div class="err">' + esc(msg) + '</div>';
  }
  if (window.__CARD__) { render(window.__CARD__); return; }
  var slug = (new URLSearchParams(location.search)).get('g') || '';
  if (!slug) { fail('Thiếu ?g=<slug> — ví dụ: guide-card.html?g=typhu'); return; }
  fetch('guide-cards.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (d) {
    var g = (d.games || []).find(function (x) { return x.slug === slug; });
    if (!g) { fail('Không có game "' + slug + '" trong guide-cards.json'); return; }
    render(g);
  }).catch(function (e) { fail('Không tải được guide-cards.json (' + e.message + ') — mở trang này qua máy chủ tĩnh ở gốc repo.'); });
})();
</script>
</body>
</html>
