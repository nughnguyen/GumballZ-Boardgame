<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cờ vua – chơi online với bạn bè hoặc đấu với máy | GumballZ</title>
<link rel="canonical" href="https://gumballzgames.vercel.app/covua/">
<meta name="description" content="Cờ vua online tiếng Việt: đấu với bạn bè, đấu với máy 3 mức, cờ thế chiếu bí, có gợi ý nước đi và thanh đánh giá bật tắt được. Miễn phí, không cần cài đặt.">
<meta property="og:type" content="website"><meta property="og:site_name" content="GumballZ">
<meta property="og:url" content="https://gumballzgames.vercel.app/covua/">
<meta property="og:title" content="Cờ vua – chơi online với bạn bè hoặc đấu với máy | GumballZ">
<meta property="og:description" content="Cờ vua cho cả hội: bấm link là vào bàn, có máy đấu cùng, cờ thế và gợi ý nước đi.">
<meta property="og:image" content="https://gumballzgames.vercel.app/shared/img/og/covua.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=3"><link rel="manifest" href="../manifest.webmanifest?v=2"><meta name="apple-mobile-web-app-title" content="GumballZ"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui/gamekit.css?v=6">
<link rel="stylesheet" href="css/covua.css?v=2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../shared/ui/shell.css?v=21">
<link rel="stylesheet" href="../shared/css/topbar.css?v=6">
</head>
<body>
<script src="../shared/ui/topbar.js?v=8"></script>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub gumballz-chip" href="../" aria-label="Về trang chủ GumballZ" title="Về trang chủ GumballZ"><img src="../favicon.svg?v=3" alt="" width="26" height="26"><span>GumballZ</span></a>
  <div class="home-card">
    <div class="hero"><img src="img/wN.svg" alt=""><img src="img/bQ.svg" alt=""><img src="img/wK.svg" alt=""></div>
    <h1 class="logo" translate="no">Cờ <span>vua</span></h1>
    <p class="tag">Tính trước ba nước – chiếu bí là thắng ♟️</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-offline">🤖 Đấu với máy / 2 người chung máy</button>
      <button class="btn big" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn big" id="btn-puzzle">🧩 Cờ thế – luyện chiếu bí</button>
      <button class="btn big" id="btn-daily">🗓️ Giải đố hôm nay</button>
      <button class="btn" id="btn-arch">📚 Giải đố các ngày trước</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Luật chơi</button>
    </div>
  </div>
</section>

<!-- PHÒNG CHỜ -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip" id="btn-copy">Sao chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h3>Hai kỳ thủ <small id="pcount"></small></h3>
        <ul id="plist" class="plist"></ul>
        <div id="add-box"></div>
      </div>
      <div class="panel">
        <h3>Luật bàn</h3>
        <div id="opts"></div>
      </div>
    </div>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
    <div class="start-bar"><button class="btn big pri" id="btn-start">♟️ Vào bàn cờ</button></div>
  </div>
</section>

<!-- BÀN CỜ -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ic" id="btn-leave" title="Rời ván" aria-label="Rời ván">←</button>
    <div class="round" id="round" aria-live="polite"></div>
    <span class="sp"></span>
    <div class="tools">
      <button class="chip ic" id="btn-hint" title="Gợi ý nước đi" aria-label="Gợi ý nước đi" aria-pressed="false">💡</button>
      <button class="chip ic" id="btn-eval" title="Thanh đánh giá" aria-label="Thanh đánh giá" aria-pressed="false">📊</button>
      <button class="chip ic" id="btn-3d" title="Bàn cờ 3D" aria-label="Bàn cờ 3D" aria-pressed="false">🧊</button>
      <button class="chip ic" id="btn-flip" title="Xoay bàn cờ" aria-label="Xoay bàn cờ">🔄</button>
      <button class="chip ic" id="btn-sound" title="Âm thanh" aria-label="Âm thanh">🔊</button>
      <button class="chip ic" id="btn-guide" title="Luật chơi" aria-label="Luật chơi">📖</button>
    </div>
  </header>
  <div class="arena">
    <div class="play">
      <div class="strip" id="strip-top"></div>
      <div class="board-row">
        <div class="evalbar" id="evalbar" hidden><i id="eval-fill"></i><b id="eval-num"></b></div>
        <div class="frame"><div class="board" id="board"></div><div class="box3d" id="box3d" hidden></div></div>
      </div>
      <div class="strip" id="strip-bot"></div>
    </div>
    <div class="side">
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="hist"><button class="chip ic" data-h="first" aria-label="Về đầu ván">⏮</button><button class="chip ic" data-h="prev" aria-label="Lùi một nước">◀</button><span id="hist-txt"></span><button class="chip ic" data-h="next" aria-label="Tới một nước">▶</button><button class="chip ic" data-h="last" aria-label="Về nước mới nhất">⏭</button></div>
      <ol class="moves" id="moves"></ol>
      <div class="acts" id="acts"></div>
    </div>
  </div>
</section>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/main.js?v=27"></script>
<script type="module" async src="../shared/ui/homebtn.js?v=71"></script> <!-- async: chạy ngay khi tải xong, không chờ main.js (nặng) → nút hiện sớm, đỡ giật -->
<script type="module" async src="../shared/ui/homesplit.js?v=1"></script>
<script type="module" async src="../shared/ui/feel.js?v=54"></script>
</body>
</html>
