<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đoán Nhạc (Songless) – nghe 1 giây đoán tên bài hát | GumballZ Boardgame</title>

<meta name="description" content="Đoán Nhạc – trò đoán bài hát kiểu Songless: nghe 1 giây đầu rồi đoán tên bài, đoán sai được nghe dài hơn. V-pop, rap Việt, US-UK, K-pop, J-pop. Chơi một mình hoặc đua với bạn bè.">
<meta property="og:type" content="website"><meta property="og:site_name" content="GumballZ Boardgame">
<meta property="og:url" content="https://gumballzgames.vercel.app/doannhac/">
<meta property="og:title" content="Đoán Nhạc (Songless) | GumballZ Boardgame">

<meta property="og:image" content="../shared/img/og/doannhac.jpg">
<meta name="theme-color" content="#FFF8EE">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="vi_VN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=3"><link rel="manifest" href="../manifest.webmanifest?v=6"><meta name="apple-mobile-web-app-title" content="GumballZ Boardgame"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="../shared/ui/gamekit.css?v=7">
<link rel="stylesheet" href="../shared/css/footer.css?v=12">
<link rel="stylesheet" href="css/doannhac.css?v=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../shared/ui/shell.css?v=23">
<link rel="stylesheet" href="../shared/css/input-ui.css?v=1">
<link rel="stylesheet" href="../shared/css/topbar.css?v=8">
</head>
<body>
<script src="../shared/ui/topbar.js?v=8"></script>

<!-- TRANG CHỦ -->
<section id="screen-home" class="screen active">
  <a class="back-hub gumballz-chip" href="../" aria-label="Về trang chủ GumballZ Boardgame" title="Về trang chủ GumballZ Boardgame"><img src="../favicon.svg?v=3" alt="" width="26" height="26"><span>GumballZ</span></a>
  <div class="home-card">
    <div class="hero"><img src="../shared/img/icons/doannhac.svg?v=1" alt=""></div>
    <h1 class="logo">Đoán <span>Nhạc</span></h1>
    <p class="tag">Nghe 1 giây là biết bài gì? Đoán sai được nghe dài hơn 🎧</p>
    <label class="fld"><span>Tên của bạn</span><input id="name" maxlength="16" placeholder="Nhập tên…" autocomplete="nickname"></label>
    <div class="btn-col">
      <button class="btn big pri" id="btn-day">📅 Bài hôm nay</button>
      <button class="btn big" id="btn-solo">🎯 Chơi một mình</button>
      <button class="btn big" id="btn-create">✨ Tạo phòng online</button>
      <div class="join-row"><input id="join-code" maxlength="5" placeholder="MÃ PHÒNG" autocomplete="off"><button class="btn" id="btn-join">Vào</button></div>
      <button class="btn" id="btn-offline">🤖 Đua với máy</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="btn-guide-home">📖 Cách chơi</button>
    </div>
    <p class="note">Bài hôm nay so với mọi người · rủ bạn vào phòng đoán chung · nhạc từ SoundCloud / Apple Music</p>
  </div>
</section>

<!-- PHÒNG CHỜ -->
<section id="screen-lobby" class="screen">
  <div class="lobby">
    <div class="lobby-head">
      <button class="chip" id="btn-leave-lobby">← Thoát</button>
      <div class="code-box" id="code-box">Mã phòng <b id="room-code">…</b> <button class="chip" id="btn-copy">Sao chép link</button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel"><h3>Người chơi <small id="pcount"></small></h3><ul id="plist" class="plist"></ul><div id="add-box"></div></div>
      <div class="panel"><h3>Luật bàn</h3><div id="opts"></div></div>
    </div>
    <p class="wait" id="wait-msg">Đang chờ chủ phòng bắt đầu…</p>
    <div class="start-bar"><button class="btn big pri" id="btn-start">🎧 Bắt đầu</button></div>
  </div>
</section>

<!-- VÁN CHƠI -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <button class="chip ic" id="btn-leave" title="Rời ván" aria-label="Rời ván">←</button>
    <div class="round" id="round" aria-live="polite"></div>
    <span class="sp"></span>
    <div class="score" id="myscore"></div>
    <div class="tools">
      <button class="chip ic" id="btn-sound" title="Âm lượng bài hát" aria-label="Âm lượng bài hát">🔊</button>
      <label class="volbox" id="volbox" hidden><input type="range" id="vol" min="0" max="100" step="5" aria-label="Âm lượng bài hát"><b id="volv"></b></label>
      <button class="chip ic" id="btn-guide" title="Cách chơi" aria-label="Cách chơi">📖</button>
    </div>
  </header>
  <div class="arena">
    <div class="tbar" id="tbar"><i></i></div>
    <div class="stage" id="stage"></div>
    <div class="acts" id="acts"></div>
    <div class="board" id="board"></div>
    <div class="hostbar" id="hostbar"></div>
  </div>
</section>

<footer class="gmf"></footer>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<script src="../shared/ui/footer.js?v=24"></script>
<script type="module" src="js/main.js?v=1"></script>
<script type="module" async src="../shared/ui/homebtn.js?v=71"></script> <!-- async: chạy ngay khi tải xong, không chờ main.js (nặng) → nút hiện sớm, đỡ giật -->
<script type="module" async src="../shared/ui/feel.js?v=54"></script>
</body>
</html>
