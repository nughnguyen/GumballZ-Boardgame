<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2a2340" flood-opacity=".16"/></filter></defs>
<g filter="url(#sh)">
<!-- 3 thẻ địa điểm xòe ra: 2 thẻ biết chỗ (bãi biển, bệnh viện) + 1 thẻ "?" của gián điệp ở giữa -->
<g transform="translate(62 92) rotate(-10)">
<rect x="-32" y="-44" width="64" height="88" rx="10" fill="#AFD8F3" stroke="#2a2340" stroke-width="3"/>
<text y="-8" text-anchor="middle" font-size="30">🏖️</text>
<text y="26" text-anchor="middle" font-family="Baloo 2, sans-serif" font-size="12" font-weight="800" fill="#2a2340">BÃI BIỂN</text>
</g>
<g transform="translate(168 92) rotate(10)">
<rect x="-32" y="-44" width="64" height="88" rx="10" fill="#FFB9CF" stroke="#2a2340" stroke-width="3"/>
<text y="-8" text-anchor="middle" font-size="30">🏥</text>
<text y="26" text-anchor="middle" font-family="Baloo 2, sans-serif" font-size="12" font-weight="800" fill="#2a2340">BỆNH VIỆN</text>
</g>
<g transform="translate(115 86)">
<rect x="-34" y="-48" width="68" height="96" rx="10" fill="#FFE3A3" stroke="#2a2340" stroke-width="3"/>
<text y="16" text-anchor="middle" font-family="Baloo 2, sans-serif" font-size="52" font-weight="800" fill="#2a2340">?</text>
</g>
<!-- kính lúp soi thẻ "?" -->
<g transform="translate(148 122)">
<circle r="20" fill="#fff" fill-opacity=".35" stroke="#2a2340" stroke-width="3"/>
<line x1="14" y1="14" x2="30" y2="30" stroke="#2a2340" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- huy hiệu Spyfall -->
<g transform="translate(296 90)">
<circle r="52" fill="#C9BDF3" stroke="#2a2340" stroke-width="3"/>
<circle r="52" fill="none" stroke="#fff" stroke-width="3"/>
<text y="-22" text-anchor="middle" font-size="26">🕵️</text>
<text y="40" text-anchor="middle" font-family="Baloo 2, sans-serif" font-size="16" font-weight="800" fill="#2a2340">SPYFALL</text>
</g>
<path d="M214 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#FFE3A3" stroke="#2a2340" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M368 150 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#FFB9CF" stroke="#2a2340" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</g>
</svg>
