<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect x="2" y="2" width="116" height="116" rx="18" fill="#FFE3A3" stroke="#4A3E5C" stroke-width="3"/>
  <!-- board -->
  <rect x="12" y="18" width="96" height="82" rx="6" fill="#FFFDF9" stroke="#4A3E5C" stroke-width="3"/>
  <!-- points: top row (pointing down) -->
  <polygon points="12,18 27,18 19.5,48" fill="#FFB98A" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="27,18 42,18 34.5,48" fill="#ABE0C6" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="42,18 57,18 49.5,48" fill="#C9BDF3" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="63,18 78,18 70.5,48" fill="#FFB98A" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="78,18 93,18 85.5,48" fill="#ABE0C6" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="93,18 108,18 100.5,48" fill="#C9BDF3" stroke="#4A3E5C" stroke-width="1.5"/>
  <!-- points: bottom row (pointing up) -->
  <polygon points="12,100 27,100 19.5,70" fill="#C9BDF3" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="27,100 42,100 34.5,70" fill="#ABE0C6" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="42,100 57,100 49.5,70" fill="#FFB98A" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="63,100 78,100 70.5,70" fill="#C9BDF3" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="78,100 93,100 85.5,70" fill="#ABE0C6" stroke="#4A3E5C" stroke-width="1.5"/>
  <polygon points="93,100 108,100 100.5,70" fill="#FFB98A" stroke="#4A3E5C" stroke-width="1.5"/>
  <!-- bar -->
  <rect x="57" y="18" width="6" height="82" fill="#C9BDF3" stroke="#4A3E5C" stroke-width="1.5"/>
  <!-- checkers: red top-left, blue bottom-right, one red on the bar -->
  <circle cx="19.5" cy="27" r="6" fill="#E05D5D" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="19.5" cy="39" r="6" fill="#E05D5D" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="34.5" cy="27" r="6" fill="#E05D5D" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="100.5" cy="91" r="6" fill="#5B8DEF" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="100.5" cy="79" r="6" fill="#5B8DEF" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="85.5" cy="91" r="6" fill="#5B8DEF" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="60" cy="59" r="6" fill="#E05D5D" stroke="#4A3E5C" stroke-width="2"/>
  <!-- two dice below the board -->
  <rect x="44" y="104" width="13" height="13" rx="3" fill="#FFFDF9" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="47.5" cy="107.5" r="1.4" fill="#4A3E5C"/><circle cx="53.5" cy="107.5" r="1.4" fill="#4A3E5C"/>
  <circle cx="50.5" cy="110.5" r="1.4" fill="#4A3E5C"/>
  <circle cx="47.5" cy="113.5" r="1.4" fill="#4A3E5C"/><circle cx="53.5" cy="113.5" r="1.4" fill="#4A3E5C"/>
  <rect x="63" y="104" width="13" height="13" rx="3" fill="#FFFDF9" stroke="#4A3E5C" stroke-width="2"/>
  <circle cx="66.5" cy="107.5" r="1.4" fill="#4A3E5C"/><circle cx="69.5" cy="110.5" r="1.4" fill="#4A3E5C"/><circle cx="72.5" cy="113.5" r="1.4" fill="#4A3E5C"/>
</svg>
