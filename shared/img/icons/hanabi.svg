<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Icon Hanabi tự vẽ: pháo hoa nổ trên nền chàm, lá bài úp phía dưới -->
  <rect width="120" height="120" rx="24" fill="#C9BDF3"/>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="none" stroke="#4A3E5C" stroke-width="3"/>
  <!-- chùm pháo hoa -->
  <g stroke="#4A3E5C" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="52" x2="60" y2="30"/>
    <line x1="60" y1="52" x2="78" y2="38"/>
    <line x1="60" y1="52" x2="84" y2="52"/>
    <line x1="60" y1="52" x2="78" y2="66"/>
    <line x1="60" y1="52" x2="60" y2="74"/>
    <line x1="60" y1="52" x2="42" y2="66"/>
    <line x1="60" y1="52" x2="36" y2="52"/>
    <line x1="60" y1="52" x2="42" y2="38"/>
  </g>
  <g stroke="#4A3E5C" stroke-width="2">
    <circle cx="60" cy="26" r="5" fill="#FF5CA8"/>
    <circle cx="80" cy="35" r="5" fill="#FFE45C"/>
    <circle cx="87" cy="52" r="5" fill="#00B8A9"/>
    <circle cx="80" cy="69" r="5" fill="#FFB98A"/>
    <circle cx="60" cy="78" r="5" fill="#FF5CA8"/>
    <circle cx="40" cy="69" r="5" fill="#FFE45C"/>
    <circle cx="33" cy="52" r="5" fill="#00B8A9"/>
    <circle cx="40" cy="35" r="5" fill="#FFB98A"/>
  </g>
  <circle cx="60" cy="52" r="7" fill="#FFE3A3" stroke="#4A3E5C" stroke-width="2.5"/>
  <!-- lá bài úp -->
  <g transform="rotate(-8 60 96)">
    <rect x="42" y="84" width="36" height="24" rx="5" fill="#FFFDF9" stroke="#4A3E5C" stroke-width="2.5"/>
    <text x="60" y="101" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#4A3E5C">?</text>
  </g>
</svg>
