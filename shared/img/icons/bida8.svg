<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="24" fill="#ABE0C6"/>
  <g stroke="#4A3E5C" stroke-width="2.5" stroke-linejoin="round">
    <!-- pool table -->
    <rect x="12" y="38" width="96" height="52" rx="10" fill="#3E9B6A"/>
    <!-- pockets -->
    <circle cx="18" cy="44" r="5" fill="#2B2440" stroke="none"/>
    <circle cx="60" cy="44" r="5" fill="#2B2440" stroke="none"/>
    <circle cx="102" cy="44" r="5" fill="#2B2440" stroke="none"/>
    <circle cx="18" cy="84" r="5" fill="#2B2440" stroke="none"/>
    <circle cx="60" cy="84" r="5" fill="#2B2440" stroke="none"/>
    <circle cx="102" cy="84" r="5" fill="#2B2440" stroke="none"/>
    <!-- solid red ball -->
    <circle cx="36" cy="64" r="9" fill="#FF6B6B"/>
    <!-- striped ball -->
    <circle cx="86" cy="64" r="9" fill="#FFFDF9"/>
    <path d="M77 64 A9 9 0 0 1 95 64 L95 64 A9 9 0 0 1 77 64 Z" fill="#7C5CFF" stroke="none"/>
    <!-- 8-ball -->
    <circle cx="60" cy="64" r="13" fill="#2B2440"/>
    <circle cx="60" cy="64" r="6.5" fill="#FFFDF9" stroke="none"/>
    <text x="60" y="68.5" font-family="Nunito, sans-serif" font-size="10" font-weight="bold" fill="#2B2440" text-anchor="middle" stroke="none">8</text>
    <!-- cue stick -->
    <rect x="92" y="8" width="5" height="34" rx="2.5" fill="#FFE3A3" transform="rotate(32 94 25)"/>
    <rect x="92" y="8" width="5" height="8" rx="2.5" fill="#7C5CFF" stroke="none" transform="rotate(32 94 25)"/>
  </g>
</svg>
