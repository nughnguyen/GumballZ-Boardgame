<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="24" fill="#C9BDF3"/>
  <!-- stacked tetrominoes, 4 columns x 4 rows, 19px cells, origin (22,24) -->
  <g stroke="#4A3E5C" stroke-width="2.5" stroke-linejoin="round">
    <!-- I piece (cyan) — top row, all 4 cells -->
    <rect x="22" y="24" width="19" height="18" fill="#AFD8F3"/>
    <rect x="41" y="24" width="19" height="18" fill="#AFD8F3"/>
    <rect x="60" y="24" width="19" height="18" fill="#AFD8F3"/>
    <rect x="79" y="24" width="19" height="18" fill="#AFD8F3"/>
    <!-- T piece (purple) — row 2 cols 1-3, stem col 2 row 3 -->
    <rect x="41" y="44" width="19" height="18" fill="#B388F5"/>
    <rect x="60" y="44" width="19" height="18" fill="#B388F5"/>
    <rect x="79" y="44" width="19" height="18" fill="#B388F5"/>
    <rect x="60" y="64" width="19" height="18" fill="#B388F5"/>
    <!-- O piece (yellow) — rows 3-4, cols 0-1 -->
    <rect x="22" y="64" width="19" height="18" fill="#FFE45C"/>
    <rect x="41" y="64" width="19" height="18" fill="#FFE45C"/>
    <rect x="22" y="84" width="19" height="18" fill="#FFE45C"/>
    <rect x="41" y="84" width="19" height="18" fill="#FFE45C"/>
    <!-- L piece (orange) — col 3 rows 2-4, foot col 2 row 4 -->
    <rect x="79" y="64" width="19" height="18" fill="#FFB98A"/>
    <rect x="79" y="84" width="19" height="18" fill="#FFB98A"/>
    <rect x="60" y="84" width="19" height="18" fill="#FFB98A"/>
  </g>
</svg>
