<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect x="4" y="4" width="112" height="112" rx="18" fill="#FFE3A3" stroke="#4A3E5C" stroke-width="3"/>
  <!-- mặt kẻ nói dối: đầu tròn + mũi dài -->
  <circle cx="52" cy="62" r="32" fill="#FFFDF9" stroke="#4A3E5C" stroke-width="3"/>
  <!-- mũi dài (Pinocchio) -->
  <path d="M80 62 L104 70 L80 76 Q74 69 80 62 Z" fill="#FFB9CF" stroke="#4A3E5C" stroke-width="2.5"/>
  <!-- mắt -->
  <circle cx="42" cy="54" r="4" fill="#4A3E5C"/>
  <circle cx="58" cy="54" r="4" fill="#4A3E5C"/>
  <!-- miệng cười gian -->
  <path d="M40 74 Q52 82 64 74" fill="none" stroke="#4A3E5C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dấu hỏi -->
  <text x="96" y="34" font-family="Nunito, sans-serif" font-weight="800" font-size="26" fill="#7C5CFF">?</text>
</svg>
