<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Icon Cờ Nhảy tự vẽ: bàn sao 6 cánh + 6 viên bi màu ở các đầu cánh -->
  <rect width="120" height="120" rx="24" fill="#FFE3A3"/>
  <rect x="4" y="4" width="112" height="112" rx="20" fill="none" stroke="#4A3E5C" stroke-width="3"/>
  <!-- ngôi sao 6 cánh (2 tam giác chồng nhau) -->
  <g fill="#FFFDF9" stroke="#4A3E5C" stroke-width="3" stroke-linejoin="round">
    <polygon points="60,16 72,52 104,52 78,72 90,106 60,86 30,106 42,72 16,52 48,52"/>
  </g>
  <!-- đường kẻ giữa bàn -->
  <g stroke="#C9BDF3" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="30" x2="60" y2="92"/>
    <line x1="30" y1="58" x2="90" y2="58"/>
    <line x1="42" y1="38" x2="78" y2="82"/>
    <line x1="78" y1="38" x2="42" y2="82"/>
  </g>
  <!-- 6 viên bi màu ở các đầu cánh + 1 viên ở giữa -->
  <g stroke="#4A3E5C" stroke-width="2.5">
    <circle cx="60" cy="26" r="8" fill="#E5484D"/>
    <circle cx="92" cy="48" r="8" fill="#4A90D9"/>
    <circle cx="82" cy="92" r="8" fill="#5DBB63"/>
    <circle cx="38" cy="92" r="8" fill="#F2C94C"/>
    <circle cx="28" cy="48" r="8" fill="#7C5CFF"/>
    <circle cx="60" cy="60" r="9" fill="#FF5CA8"/>
  </g>
  <!-- bóng sáng trên bi giữa -->
  <circle cx="57" cy="57" r="3" fill="#FFFDF9" opacity="0.85"/>
</svg>
