      <rect x="74" y="74" width="24" height="24" rx="3" fill="#FFFDF9"/>
    </g>
    <!-- X mark on an empty cell -->
    <path d="M78 78 l16 16 M94 78 l-16 16" fill="none" stroke="#FF5CA8" stroke-width="3" stroke-linecap="round"/>
