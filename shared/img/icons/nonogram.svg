    <text x="14" y="74" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#4A3E5C" text-anchor="middle">3</text>
    <text x="14" y="98" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#4A3E5C" text-anchor="middle">1</text>
