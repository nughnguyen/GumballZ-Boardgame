<!doctype html>
<html lang="vi" data-ui-sfx="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sảnh chung – GumballZ Boardgame</title>
<link rel="canonical" href="https://gumballzgames.vercel.app/sanh/">
<meta name="description" content="Sảnh chung GumballZ Boardgame: tìm phòng công khai để chơi board game cùng người lạ, chat với mọi người.">
<meta property="og:title" content="Sảnh chung GumballZ Boardgame – tìm người chơi cùng">
<meta property="og:description" content="Phòng công khai của mọi game + chat chung. Bấm là vào chơi, không cần cài đặt.">
<meta property="og:image" content="https://gumballzgames.vercel.app/shared/img/og.jpg?v=4">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="../shared/img/brand/apple-touch-icon.png?v=3"><link rel="manifest" href="../manifest.webmanifest?v=6"><meta name="apple-mobile-web-app-title" content="GumballZ Boardgame"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#4A3E5C;--muted:#8B7E9E;--bg:#FFF8EE}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
.blob{position:fixed;width:44vmax;height:44vmax;border-radius:50%;filter:blur(80px);opacity:.22;z-index:0;pointer-events:none}
.b1{background:#FFB98A;left:-14vmax;top:-14vmax}.b2{background:#FFE3A3;right:-14vmax;top:-8vmax}.b3{background:#ABE0C6;left:-8vmax;bottom:-18vmax}.b4{background:#C9BDF3;right:-12vmax;bottom:-16vmax}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 16px 16px;height:100dvh;min-height:560px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px} /* cao đúng 1 màn hình: danh sách phòng + chat tự cuộn bên trong, trang không dài vô hạn */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:44px;padding:6px 16px;border-radius:999px;background:#FFFDF9;border:2.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:800;box-shadow:3px 3px 0 rgba(74,62,92,.13)}
h1{font-family:var(--font-display,"Bungee","Baloo 2",Nunito,sans-serif);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;flex:1;text-align:center}
h1 span{color:var(--ink)}
.sub{text-align:center;color:var(--muted);margin:-4px auto 0;max-width:640px;font-size:15px}
.online{text-align:center;margin:-6px auto 0;font:700 14px Nunito,sans-serif;color:#137a4c;background:#FFFDF9;border:2px solid #bce8cf;border-radius:999px;padding:4px 14px;width:max-content;max-width:100%}
#lobby{flex:1;min-height:0;display:flex;flex-direction:column}
#lobby .lb{flex:1;min-height:0}
@media (max-width:520px){.top h1{order:3;flex-basis:100%}}
@media (max-width:760px){main{gap:8px;padding-bottom:10px}.sub{display:none}.top h1{font-size:30px}} /* điện thoại: gọn phần đầu để chat/phòng có nhiều chỗ */
</style>
<link rel="stylesheet" href="../shared/ui/shell.css?v=19">
<link rel="stylesheet" href="../shared/css/footer.css?v=4">
</head>
<body>
<div id="gumballz-splash" aria-hidden="true"><i></i><b></b></div><script>(function(){var s=document.getElementById("gumballz-splash");function h(){if(!s)return;var x=s;s=null;x.className="out";setTimeout(function(){x.remove()},320)}addEventListener("load",h);addEventListener("pageshow",h);setTimeout(h,4500)})()</script>
<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
<main>
  <div class="top"><a class="back gumballz-chip" href="../" aria-label="Về trang chủ GumballZ Boardgame" title="Về trang chủ GumballZ Boardgame"><img src="../favicon.svg?v=3" alt="" width="26" height="26"><span>GumballZ</span></a><h1>🌐 <span>Sảnh chung</span></h1><div id="acct"></div></div>
  <p class="sub">Tìm phòng công khai để vào chơi cùng người lạ, hoặc tạo phòng rồi bật <b>🌐 Công khai</b> để rủ thêm người 🥰</p>
  <p class="online" id="online" style="visibility:hidden">&nbsp;</p>
  <div id="lobby"></div>
</main>
<script type="module">
import { mountAccount } from '../shared/ui/account.js?v=49';
import { mountLobby } from '../shared/ui/lobby.js?v=55';
import { mountOnline } from '../shared/net/presence.js?v=26';
mountOnline(document.getElementById('online'));
mountAccount(document.getElementById('acct'));
const g = new URLSearchParams(location.search).get('game');
const L = mountLobby(document.getElementById('lobby'), {});
import('../shared/ui/worldchat.js?v=1').then(m => m.mountWorldChat());
if (g) setTimeout(() => document.querySelector(`.lb-gf button[data-g="${CSS.escape(g)}"]`)?.click(), 0);
</script>
<footer class="gmf"></footer>
<script src="../shared/ui/footer.js?v=8"></script>
<script type="module" src="../shared/ui/feedback.js?v=34"></script>
<script type="module" async src="../shared/ui/feel.js?v=53"></script>
</body>
</html>
