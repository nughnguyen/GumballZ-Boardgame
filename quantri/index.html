<style>
:root{--ink:#4A3E5C;--muted:#8B7E9E;--bg:#FFF8EE;--line:#E9DCC6}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.5 Nunito,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;min-height:42px;padding:6px 16px;border-radius:999px;background:#FFFDF9;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800}
h1{font:400 clamp(24px,6vw,36px) var(--font-display,"Bungee","Baloo 2",Nunito,sans-serif);margin:0;flex:1;text-align:center;white-space:nowrap}@media(max-width:560px){h1{order:-1;flex-basis:100%}.top{justify-content:space-between}}
.card{background:#FFFDF9;border:3px solid var(--ink);border-radius:20px;padding:16px;margin:14px 0;box-shadow:3px 3px 0 rgba(74,62,92,.13)}
input,button,select{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid #E9DCC6}
button{background:var(--ink);color:#fff;border:0;cursor:pointer;font-weight:800}button.sm{padding:5px 11px;font-size:13px;border-radius:999px}button.red{background:#e0384a}button.gray{background:#8B7E9E}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;scrollbar-width:none}.tabs button{flex:none;background:#FFFDF9;color:var(--ink);border:1.5px solid var(--line);border-radius:999px}.tabs button.on{background:var(--ink);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#FFFDF9;border-radius:16px;padding:12px;text-align:center;box-shadow:0 8px 20px -16px rgba(74,62,92,.4)}.stat b{display:block;font:800 30px "Baloo 2",Nunito}.stat small{color:var(--muted)}
.it{background:#FFFDF9;border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 10px #0001}.meta{font-size:12.5px;color:#8B7E9E;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{padding:2px 8px;border-radius:999px;background:#eee;font-weight:800}.bug{background:#ffd9dc}.idea{background:#dff5e6}.adm{background:#e6e0ff}
.msg{white-space:pre-wrap;margin:6px 0;word-break:break-word}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.r{margin-left:auto}
.muted{color:var(--muted)}
.cfl{display:inline-flex;align-items:center;min-height:38px;padding:6px 14px;border-radius:999px;background:#f6821f;color:#fff;text-decoration:none;font-weight:800;font-size:13.5px}.cfl:nth-child(n+2){background:#FFFDF9;color:var(--ink);border:1.5px solid var(--line)}
.use h2{margin:0 0 4px;font:400 18px var(--font-display,"Bungee","Baloo 2",Nunito,sans-serif)}.bar{height:14px;border-radius:999px;background:#F1E8D8;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;border-radius:999px;background:#2fc76f;transition:width .4s}
.bar.warn i{background:#f5a524}.bar.full i{background:#e0384a}.alert{border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800}.alert.warn{background:#fff1d6;color:#8a5a00}.alert.full{background:#ffd9dc;color:#a01828}
.days{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:10px}.days div{flex:1;text-align:center;font-size:11px;color:var(--muted)}.days span{display:block;background:#C9BDF3;border-radius:6px 6px 0 0;margin:0 auto 2px;width:70%;min-height:2px}.hrs{display:flex;gap:2px;align-items:flex-end;height:86px;margin-top:4px}.hrs div{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}.hrs span{display:block;background:#ffb27a;border-radius:4px 4px 0 0;margin:0 auto 2px;width:82%;min-height:2px}.hrs .now span{background:#ff7a45}.hrs em{font-style:normal;display:block;height:13px}.chart-h{font-weight:800;font-size:13.5px;margin-top:14px}.chart-h small{font-weight:700;color:var(--muted)}#st{min-height:22px;color:#c0263b;font-weight:700}
.cfu{margin-top:14px;padding-top:12px;border-top:1px dashed #E9DCC6}.cfu h3{margin:0 0 6px;font:400 16px var(--font-display,"Bungee","Baloo 2",Nunito,sans-serif)}.cfr{margin:8px 0 2px}.cfr span{display:inline-block;margin-right:12px;font-size:13.5px}.cfr>b{display:block}.cfcost{margin:4px 0 8px;font-size:15px}.cfu code{background:#FFF8EE;padding:1px 5px;border-radius:5px}

<body>
<main>
  <div class="top"><a class="back gumballz-chip" href="../" aria-label="Về trang chủ GumballZ Boardgame" title="Về trang chủ GumballZ Boardgame"><img src="../favicon.svg?v=3" alt="" width="26" height="26"><span>GumballZ</span></a><h1>🛠️ Quản trị GumballZ</h1><span id="acct"></span></div>

<script type="module">
import { auth, API } from '../shared/net/api.js?v=29';
import { mountAccount, openLogin } from '../shared/ui/account.js?v=52';
import { confirmBox, promptBox, alertBox, chooseBox } from '../shared/ui/dialog.js?v=8';
import { ensureBadgesCSS, tierBadges, uid6 } from '../shared/ui/badges.js?v=3'; /* 🎖️ huy hiệu 4 bậc (patch -95); uid6: id hiển thị 6 số (patch -108) */
import '../shared/net/presence.js?v=26';
mountAccount(document.getElementById('acct'));
ensureBadgesCSS();
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dt = t => new Date(t).toLocaleString('vi-VN'), T = { bug: '🐞 Lỗi', idea: '💡 Góp ý', other: '💬 Khác' };
const AU = { 'claim-admin': '🛡️ Kích hoạt quản trị', role: '🎭 Đổi quyền', 'transfer-owner': '👑 Nhượng quyền chủ sảnh', supporter: '💎 Nhà Tài Trợ', donate: '☕ Duyệt ủng hộ', 'ban-account': '⛔ Khoá tài khoản', 'unban-account': '✅ Mở khoá tài khoản', 'reset-password': '🔑 Đặt lại mật khẩu', mute: '🔇 Cấm chat', unmute: '🔊 Gỡ cấm chat', ban: '⛔ Cấm chat', unban: '✅ Gỡ cấm chat', hide: '🙈 Ẩn tin', dismiss: '🗑️ Bỏ qua báo cáo' };
let tab = 'rp';
async function api(body) {
  try { const r = await fetch(API() + '/admin/list', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + auth.token() }, body: JSON.stringify(body || {}) }); return await r.json(); }
  catch (e) { return { ok: false, msg: 'Không kết nối được máy chủ' }; }
}
async function gate() {
  const u = auth.user();
  if (u && u.admin) { $('#gate').hidden = true; $('#panel').hidden = false; window.__role = u.role != null ? +u.role : 2; /* 🎭 tài khoản cũ chưa có role → mặc định Quản trị */ document.querySelector('#tabs [data-t="au"]').hidden = window.__role !== 2; document.querySelector('#tabs [data-t="dn"]').hidden = window.__role !== 2; go(tab); stats(); usage(); clearInterval(window.__useT); window.__useT = setInterval(usage, 60000); return; }
  $('#panel').hidden = true; $('#gate').hidden = false;
  if (!u) { $('#gate').innerHTML = '<h2 style="margin-top:0">Đăng nhập trước nha</h2><p>Trang này chỉ dành cho quản trị viên GumballZ Boardgame. Đăng nhập (Google hoặc tên đăng nhập) bằng tài khoản quản trị.</p><button id="g-login">👤 Đăng nhập</button>'; $('#g-login').onclick = () => openLogin(); return; }
  $('#gate').innerHTML = `<h2 style="margin-top:0">Kích hoạt quyền quản trị</h2><p>Bạn đang đăng nhập là <b>${esc(u.name)}</b>. Nhập mật khẩu quản trị (<code>ADMIN_KEY</code> đặt trên Cloudflare) <b>một lần</b> để cấp quyền cho tài khoản này. Lần sau chỉ cần đăng nhập là vào được.</p>
    <form id="g-f" style="display:flex;gap:8px;flex-wrap:wrap"><input id="g-k" type="password" placeholder="Mật khẩu quản trị" autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;min-width:200px"><button>Kích hoạt</button></form><p id="g-e" style="color:#c0263b;font-weight:700"></p>`;
  $('#g-f').onsubmit = async e => { e.preventDefault(); const r = await fetch(API() + '/auth/claim-admin', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + auth.token() }, body: JSON.stringify({ key: $('#g-k').value }) }).then(r => r.json()).catch(() => ({ ok: false, msg: 'Lỗi mạng' }));
    if (r.ok) { localStorage.setItem('gumballz-auth', JSON.stringify({ token: auth.token(), user: r.user })); gate(); } else $('#g-e').textContent = r.msg; };
}
auth.onChange(() => gate()); auth.refresh().then(() => gate());
async function stats() {
  const s = await api({ op: 'stats' }); if (!s.ok) return;
  const on = await fetch(API() + '/presence').then(r => r.json()).catch(() => ({}));
  $('#stats').innerHTML = [[on.n ?? '–', '🟢 Đang online'], [s.online, '💬 Đang ở sảnh/web'], [s.rooms, '🚪 Phòng công khai'], [s.users, '🧑 Tài khoản']].map(([n, t]) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`).join('');
}
// 📊 Hạn mức Cloudflare (ước tính, cập nhật mỗi phút)
const CF_DASH = 'https://dash.cloudflare.com/?to=/:account';
const hm = t => new Date(t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
// 🎮 số đang chơi / online: nhận tức thì qua kết nối presence
let LIVE = window.__gumballzLive || null;
const drawLive = () => {
  const el = document.getElementById('live-line'); if (el) el.innerHTML = LIVE ? `🔴 <b>LIVE</b> · 🎮 Đang chơi: <b>${LIVE.rooms}</b> phòng · <b>${LIVE.players}</b> người · 🟢 online <b>${LIVE.n}</b>` : '🎮 Đang kết nối…';
  const s = document.querySelector('#stats .stat b'); if (s && LIVE) s.textContent = LIVE.n;
};
addEventListener('gumballz-live', e => { LIVE = e.detail; drawLive(); });
async function usage() {
  const u = await api({ op: 'usage' }); if (!u.ok) { $('#use').innerHTML = '<p class="muted">Chưa đọc được hạn mức (máy chủ chưa cập nhật?)</p>'; return; }
  const pg = Math.min(100, u.gbs / u.limGbs * 100), pr = Math.min(100, u.req / u.limReq * 100), lv = p => p >= 100 ? 'full' : p >= 85 ? 'warn' : '';
  const per = u.per === 'day' ? 'hôm nay' : 'tháng này', reset = u.per === 'day' ? 'Làm mới lúc ' + hm(u.resetAt) + ' sáng mai' : 'Làm mới ngày ' + new Date(u.resetAt).toLocaleDateString('vi-VN');
  const alert = u.level === 'full' ? `<div class="alert full">⛔ ĐÃ HẾT hạn mức ${per}! Phòng mới đang chạy bằng đường dự phòng (Firebase / P2P) – có thể chậm, rớt mạng. ${reset}. Muốn chạy tiếp ngay: nâng gói Workers Paid (5 USD/tháng).</div>`
    : u.level === 'warn' ? `<div class="alert warn">⚠️ Sắp hết hạn mức ${per} (${u.pct}%). ${u.eta ? 'Với tốc độ hiện tại sẽ hết khoảng <b>' + hm(u.eta) + '</b>.' : ''} ${reset}.</div>`
    : u.eta && u.plan !== 'paid' ? `<div class="alert warn">⏳ Với tốc độ hiện tại sẽ hết hạn mức khoảng <b>${hm(u.eta)}</b> – trước giờ làm mới.</div>` : ''; /* gói Paid: vượt phần có sẵn chỉ tính thêm tiền, web không bị chặn → không báo động (xem ước tính tiền ở ô "Số thật từ Cloudflare") */
  const mx = Math.max(1, ...u.days.map(d => d.gbs));
  const hmx = Math.max(1, ...(u.hours || []).map(x => x.gbs)), hBest = (u.hours || []).reduce((a, x) => x.gbs > (a ? a.gbs : 0) ? x : a, null), hTop = hBest ? `${new Date(hBest.h).getHours()}h–${(new Date(hBest.h).getHours() + 1) % 24}h (${hBest.gbs} GB-s)` : 'chưa có';
  $('#use').innerHTML = `<h2>📊 Hạn mức máy chủ ${per} <small class="muted" style="font:700 13px Nunito">· gói ${u.plan === 'paid' ? 'Workers Paid' : 'Miễn phí'} · GumballZ tự đo (ước tính)</small></h2>${alert}
    <div><b>⏱️ Thời gian chạy phòng:</b> ${u.gbs.toLocaleString('vi-VN')} / ${u.limGbs.toLocaleString('vi-VN')} GB-s (${pg.toFixed(1)}%)<div class="bar ${lv(pg)}"><i style="width:${pg}%"></i></div>
    <small class="muted">Còn khoảng <b>${u.roomHoursLeft} giờ-phòng</b> (vd. ${Math.floor(u.roomHoursLeft)} phòng chơi liền 1 tiếng) · đang dùng ~${u.rate.toLocaleString('vi-VN')} GB-s/giờ</small></div>
    <div style="margin-top:8px"><b>📨 Lượt gọi máy chủ:</b> ${u.req.toLocaleString('vi-VN')} / ${u.limReq.toLocaleString('vi-VN')} (${pr.toFixed(1)}%)<div class="bar ${lv(pr)}"><i style="width:${pr}%"></i></div></div>
    <p class="muted" style="margin:8px 0 0"><span id="live-line"></span> · cao điểm hôm nay: ${u.peak} người · ${reset}</p>
    <div class="chart-h">📅 7 ngày gần nhất <small>· GB-s mỗi ngày</small></div>
    <div class="days">${u.days.map(d => `<div title="${d.gbs} GB-s · ${d.req} lượt"><span style="height:${Math.round(d.gbs / mx * 50)}px"></span>${new Date(d.day).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' })}</div>`).join('')}</div>
    ${u.hours ? `<div class="chart-h">🕐 24 giờ gần nhất <small>· thời gian chạy phòng theo từng giờ · đông nhất: ${hTop}</small></div><div class="hrs">${u.hours.map((x, i) => { const hh = new Date(x.h).getHours(); return `<div class="${i === 23 ? 'now' : ''}" title="${hh}:00–${(hh + 1) % 24}:00 · ${x.gbs} GB-s ≈ ${Math.round(x.gbs / 0.125 / 60)} phút-phòng · ${x.req} lượt"><span style="height:${Math.round(x.gbs / hmx * 62)}px"></span><em>${hh % 3 === 0 ? hh + 'h' : ''}</em></div>`; }).join('')}</div>` : ''}
    <div class="acts" style="margin-top:10px"><a class="cfl" href="${CF_DASH}/workers/services/view/gumballz-rooms/production/metrics" target="_blank" rel="noopener">📈 Số chính xác trên Cloudflare</a><a class="cfl" href="${CF_DASH}/workers/plans" target="_blank" rel="noopener">⬆️ Nâng gói Workers</a><a class="cfl" href="${CF_DASH}/workers/services/view/gumballz-rooms/production/settings" target="_blank" rel="noopener">⚙️ Cài đặt máy chủ</a></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">"Đang chơi" cập nhật tức thì (chỉ tính phòng online, không tính chơi với bot trên máy). Số hạn mức do GumballZ tự đo nên lệch chút ít – bấm nút để xem số chính xác (cần đăng nhập Cloudflare).</p>`;
  drawLive(); if (window.__role !== 1) cfUse(); /* Mod không được xem số Cloudflare → khỏi gọi (tránh 403) */
}
// 📈 số thật đọc từ Cloudflare (máy chủ hỏi GraphQL Analytics, giữ 5 phút)
async function cfUse() {
  const box = document.createElement('div'); box.id = 'cfu'; box.className = 'cfu'; $('#use').appendChild(box);
  box.innerHTML = '<p class="muted">📈 Đang lấy số thật từ Cloudflare…</p>';
  const c = await api({ op: 'cf' });
  if (!c.ok) {
    box.innerHTML = c.need === 'token'
      ? `<h3>📈 Số thật từ Cloudflare</h3><p class="muted">Chưa nối. Làm 1 lần: Cloudflare → <b>Manage account → Account API tokens</b> → Create token → <b>Custom</b>, quyền <b>Account · Account Analytics · Read</b> → tạo xong chép token, rồi vào <b>Workers & Pages → gumballz-rooms → Settings → Variables and Secrets</b> → Add, loại <b>Secret</b>, tên <code>CF_API_TOKEN</code>, dán token vào. Không cần gửi token cho ai.</p>`
      : `<h3>📈 Số thật từ Cloudflare</h3><p class="muted">Chưa đọc được: ${esc(c.msg || 'lỗi')}</p>`;
    return;
  }
  const L = { req: 1000000, gbs: 400000, reads: 25e9, writes: 50e6 }, n = x => x == null ? '–' : Math.round(x).toLocaleString('vi-VN');
  const T = c.today, M = c.month, since = c.since ? new Date(c.since + 'T00:00:00Z').toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' }) : '';
  const row = (label, t, m, lim, unit = '') => { const p = m == null ? 0 : Math.min(100, m / lim * 100); return `<div class="cfr"><b>${label}</b><div><span>Hôm nay: <b>${n(t)}</b>${unit}</span><span>Kỳ này: <b>${n(m)}</b> / ${n(lim)}${unit} có sẵn (${m == null ? '–' : (m / lim * 100).toFixed(1) + '%'})</span></div><div class="bar ${p >= 100 ? 'full' : p >= 85 ? 'warn' : ''}"><i style="width:${p}%"></i></div></div>`; };
  /* ước tính tiền cả kỳ: lấy trung bình mỗi ngày đã qua × 30 ngày */
  const days = Math.max(1, (Date.now() - Date.parse(c.since + 'T00:00:00Z')) / 864e5), per30 = x => (x || 0) / days * 30;
  const cost = 5 + Math.max(0, per30(M.req) - L.req) / 1e6 * 0.15 + Math.max(0, per30(M.gbs) - L.gbs) / 1e6 * 12.5 + Math.max(0, per30(M.writes) - L.writes) / 1e6 * 1;
  const BY = { http: 'mở kết nối / gọi web', jsrpc: 'máy chủ gọi nhau', alarm: 'hẹn giờ', hibernation: 'tin trong phòng (÷20)' };
  const by = Object.entries(T.by || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${BY[k] || k}: ${n(k === 'hibernation' ? v / 20 : v)}`).join(' · ');
  box.innerHTML = `<h3>📈 Số thật từ Cloudflare <small class="muted">· gói Workers Paid · kỳ tính tiền từ ${since} · cập nhật ${hm(c.at)}</small></h3>
    <div class="cfcost">💵 Ước tính cả kỳ: <b>~${cost.toFixed(2)} USD</b> <small class="muted">(5 USD gói + phần dùng thêm, theo mức dùng trung bình mỗi ngày tới giờ)</small></div>
    ${row('📨 Lượt gọi Durable Objects', T.req, M.req, L.req)}
    <small class="muted">Hôm nay theo loại: ${by || '–'}. Trang Cloudflare ghi "Requests" ${n(T.reqRaw)} vì chưa chia 20 cho tin trong phòng.</small>

  if (b.dataset.ub) { if (!(await confirmBox(b.dataset.v === '1' ? 'Tài khoản này sẽ bị khoá và đăng xuất khỏi mọi máy.' : 'Tài khoản này sẽ đăng nhập lại được.', { title: b.dataset.v === '1' ? 'Khoá tài khoản?' : 'Mở khoá tài khoản?', ok: b.dataset.v === '1' ? 'Khoá' : 'Mở khoá', danger: b.dataset.v === '1' }))) return; await api({ op: 'user', id: b.dataset.ub, patch: { banned: b.dataset.v === '1' } }); return go('us'); }
  if (b.dataset.role) { const v = +b.dataset.v, label = v === 2 ? 'Người này sẽ có toàn quyền quản trị: cấp quyền, đặt lại mật khẩu, xem nhật ký.' : v === 1 ? 'Người này sẽ làm Mod: xem báo cáo, cấm chat/khoá tài khoản, nhưng không cấp quyền hay đặt lại mật khẩu.' : 'Người này sẽ không vào được trang Quản trị nữa.'; if (!(await confirmBox(label, { title: v === 2 ? 'Cấp quyền Quản trị?' : v === 1 ? 'Cấp quyền Mod?' : 'Thu hồi quyền?', ok: v ? 'Cấp quyền' : 'Thu hồi', danger: v === 0 }))) return; await api({ op: 'user', id: b.dataset.role, patch: { role: v } }); return go('us'); }
  if (b.dataset.sup) { const v = +b.dataset.v, name = b.closest('.it')?.querySelector('.meta b')?.textContent || ('id ' + b.dataset.sup); if (!(await confirmBox(v === 1 ? name + ' sẽ mang huy hiệu 💎 Nhà Tài Trợ ở mọi nơi (chat, bảng xếp hạng, hồ sơ, bạn bè). Chỉ Quản trị mới cấp/thu hồi được.' : 'Thu hồi huy hiệu 💎 Nhà Tài Trợ của ' + name + '?', { title: v === 1 ? '💎 Cấp huy hiệu Nhà Tài Trợ?' : '💎 Thu hồi huy hiệu Nhà Tài Trợ?', ok: v === 1 ? 'Cấp danh hiệu' : 'Thu hồi', danger: v === 0 }))) return; const r = await api({ op: 'user', id: b.dataset.sup, patch: { supporter: v } }); if (r.ok) return go('us'); await alertBox(r.msg || 'Không đổi được huy hiệu.', { title: 'Chưa đổi được' }); }
  if (b.dataset.transfer) { const tid = +b.dataset.transfer, tname = b.dataset.name || ('id ' + tid); if (!(await confirmBox('Chủ sảnh sẽ chuyển sang ' + tname + ' (id ' + tid + '). Tài khoản của bạn còn quyền Quản trị, không còn là chủ sảnh nữa. Điểm/ví/nhân vật của 2 tài khoản không đổi chỗ.', { title: '👑 Nhượng quyền chủ sảnh?', ok: 'Nhượng quyền', danger: true }))) return; const r = await api({ op: 'transfer-owner', id: tid }); if (r.ok) { await alertBox('Chủ sảnh giờ là ' + tname + '.', { title: '✅ Đã nhượng quyền' }); return go('us'); } await alertBox(r.msg || 'Không nhượng được.', { title: 'Chưa nhượng được' }); }
  if (b.dataset.pw) { const pw = await promptBox('Đặt xong thì nhắn mật khẩu mới cho người đó.', { title: '🔑 Đặt lại mật khẩu', placeholder: 'Mật khẩu mới (ít nhất 6 ký tự)', maxlength: 100, ok: 'Đặt lại' }); if (pw && pw.length >= 6) { await api({ op: 'user', id: b.dataset.pw, patch: { password: pw } }); await alertBox('Nhắn người đó mật khẩu mới nha.', { title: '✅ Đã đặt lại mật khẩu' }); } else if (pw) await alertBox('Mật khẩu cần ít nhất 6 ký tự.', { title: 'Chưa đặt được' }); }
};
